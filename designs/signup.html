</div>

<p class="font-body-md text-body-md text-inverse-primary max-w-xs">

<span>|</span>

<!-- Full Name -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="fullName">Full name</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-secondary focus:bg-surface-white transition-all text-on-surface placeholder:text-outline-variant" id="fullName" placeholder="Enter Full name" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-secondary focus:bg-surface-white transition-all text-on-surface placeholder:text-outline-variant" id="email" placeholder="Enter email" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 rounded-lg px-4 py-3 text-body-md focus:ring-2 focus:ring-secondary focus:bg-surface-white transition-all text-on-surface placeholder:text-outline-variant" id="password" placeholder="Enter Password" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded text-vibrant-green border-outline-variant focus:ring-vibrant-green bg-surface-white cursor-pointer" id="terms" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant cursor-pointer" for="terms">I agree to the <a class="text-secondary hover:underline" href="#">Terms and Conditions</a></label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-vibrant-green hover:bg-tertiary-fixed-dim text-on-primary font-bold py-3 px-4 rounded-lg transition-colors duration-200 shadow-sm mt-6 flex justify-center items-center" type="submit">
